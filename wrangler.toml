name = "registrai-agents"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Cron triggers. Add one per agent. The dispatch in src/worker.ts maps each
# cron expression to its agent.
[triggers]
crons = [
  "0 14 * * *",   # warsaw + cpi + ecb + warsaw-verifiable attestations, daily 14:00 UTC
  "0 */6 * * *",  # market proposer (LLM), every 6 hours
  "*/15 * * * *", # market-maker bot, every 15 minutes
  "*/30 * * * *", # v0.5 CirqueLending: bonded BTC/USD oracle agent + cirBTC integrity monitor
]

[[kv_namespaces]]
binding = "PROPOSALS"
id = "f084e51e62ed4ca9947ec5ef508da6cd"

[[kv_namespaces]]
binding = "MARKET_DESCRIPTIONS"
# Set this via `wrangler kv namespace create MARKET_DESCRIPTIONS` and paste the id below.
id = "10515ad1c7f0439aa2e772839cd094f0"

[[kv_namespaces]]
binding = "SOCIAL_CLAIMS"
# Stores quest claims (per-wallet) and twitter-handle → wallet bindings.
id = "66eed5c1acf042c3820c443d712dc56e"

# Public (non-secret) bindings — contract addresses, feed ids, methodology CIDs.
# Secrets (PRIVATE_KEY, RPC_URL, NBP_REPORT_URL) are set via:
#   wrangler secret put PRIVATE_KEY
[vars]
# Borrow-against-bet stack (deployed 2026-06-01). The force-close keeper runs
# on the */30 cron and reuses KEEPER_PRIVATE_KEY unless BET_KEEPER_PRIVATE_KEY
# is set as a secret.
BET_LENDING_ADDR = "0x8168bdD7990abc42b92b59DE6d411e9C66bB93C1"
MARKETS_V3_ADDR = "0xDDC085320D5A739cB5726f01E9c4b5d058fFfB00"
